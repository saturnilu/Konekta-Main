<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Konekta</title>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
    }

    @media (min-width: 560px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 15%, #24365a 0%, #0b0f1a 75%);
        overflow: hidden;
      }

      .phone-frame {
        position: relative;
        width: 390px;
        height: 844px;
        max-height: 92vh;
        border-radius: 48px;
        padding: 14px;
        background: linear-gradient(160deg, #3a3a3c, #1c1c1e 60%);
        box-shadow:
          0 30px 70px rgba(0, 0, 0, 0.55),
          0 10px 25px rgba(0, 0, 0, 0.35);
      }

      .phone-screen {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 36px;
        overflow: hidden;
        background: #000;
      }

      .phone-frame iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: none;
      }

      .phone-frame::before {
        content: "";
        position: absolute;
        top: 26px;
        left: 50%;
        transform: translateX(-50%);
        width: 110px;
        height: 30px;
        background: #050505;
        border-radius: 18px;
        z-index: 10;
        pointer-events: none;
      }

      .phone-frame::after {
        content: "";
        position: absolute;
        bottom: 22px;
        left: 50%;
        transform: translateX(-50%);
        width: 128px;
        height: 4px;
        background: rgba(255, 255, 255, 0.55);
        border-radius: 3px;
        z-index: 10;
        pointer-events: none;
      }
    }

    @media (max-width: 559px) {
      .phone-frame {
        width: 100%;
        height: 100%;
        padding: 0;
        background: none;
        box-shadow: none;
      }
      .phone-screen {
        width: 100%;
        height: 100%;
        border-radius: 0;
      }
      .phone-frame iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: none;
      }
      .phone-frame::before,
      .phone-frame::after {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="phone-screen">
      <iframe src="app.html" title="Konekta"></iframe>
    </div>
  </div>
</body>
</html>
